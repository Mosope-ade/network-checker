[package]
name = "netcheck"
version = "0.1.0"
edition = "2021"
description = "GUI ping monitor with persistent downtime logs"

[dependencies]
tokio = { version = "1.53.3", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
surge-ping = "0.8"
chrono = "0.4"
serde_json = "1.0"

axum = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
