[package]
name = "netcheck"
version = "0.1.0"
edition = "2021"
description = "Network health monitor and diagnostic service"

[dependencies]
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
serde = { version = "1", features = ["derive"] }
toml = "0.8"
thiserror = "2"
surge-ping = "0.8"
chrono = "0.4"
serde_json = "1.0"
